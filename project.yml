name: MeetingSummary
options:
  bundleIdPrefix: com.example
  # 앱 기본 언어를 한국어로 (날짜·시간 표기가 "11월 10일 오후 1:31"처럼 나오도록)
  developmentLanguage: ko
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# 버전은 여기 한 곳에만 둔다.
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "99"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # 내 Apple 개발자 팀 ID를 넣는다 (Xcode에서 서명할 때)
    DEVELOPMENT_TEAM: ""
targets:
  MeetingSummary:
    type: application
    platform: iOS
    # 프록시 주소·앱 토큰 (Config/Secrets.xcconfig, 저장소 제외)
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: MeetingSummary
    info:
      path: MeetingSummary/Info.plist
      properties:
        # 화면이 꺼지거나 다른 앱으로 전환해도 녹음·받아쓰기가 이어지도록
        UIBackgroundModes: [audio]
        MSProxyHost: $(PROXY_HOST)
        MSProxyToken: $(PROXY_APP_TOKEN)
        MSAgentHost: $(AGENT_HOST)
        MSAgentToken: $(AGENT_APP_TOKEN)
        # xcodegen 기본값(1.0/1)이 빌드 설정을 덮지 않도록 명시한다.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 위젯을 누르면 내 공간 탭으로 (moa://space, D109)
        CFBundleURLTypes:
          - CFBundleURLName: com.example.meetingsummary
            CFBundleURLSchemes: [moa]
    # 날씨 카드(D66): Apple 날씨(WeatherKit). 앱 ID에도 이 기능이 켜져 있어야 서명된다 (개발자 사이트에서 직접 켠다)
    # 알림 확장(D73): 앱에 함께 담긴다
    dependencies:
      - target: NotificationService
      # 홈 화면 위젯(D109): 앱에 함께 담긴다
      - target: MoaWidget
    entitlements:
      path: MeetingSummary/MeetingSummary.entitlements
      properties:
        com.apple.developer.weatherkit: true
        # 알림(D67): 앱 ID에 Push Notifications가 켜져 있어야 서명된다. Xcode로 넣는 빌드는 development, TestFlight는 production
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.meetingsummary
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 강조색마다 바꿔 끼우는 앱 아이콘 (D144). 기본(민트)은 AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Blue AppIcon-Violet AppIcon-Coral AppIcon-Orange AppIcon-Pink"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: 모아
        INFOPLIST_KEY_NSCameraUsageDescription: 질문에 붙일 사진을 찍는 데 카메라를 사용합니다. 찍은 사진은 사진 보관함에 저장하지 않습니다.
        INFOPLIST_KEY_NSContactsUsageDescription: 메일 받을 사람을 이름으로 찾는 데 연락처를 사용합니다. 말에 이름이 나온 사람의 이름과 메일 주소만 내 맥으로 보냅니다.
        # 통화(D134, 사용자 승인 2026-11-17)에도 쓴다
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 대화를 녹음해 텍스트로 받아쓰고, 모아와 통화할 때 내 말을 듣기 위해 마이크를 사용합니다.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 녹음한 대화와 통화 중 내 말을 이 기기 안에서 텍스트로 바꾸는 데 사용합니다. 음성은 서버로 보내지 않습니다.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: 회의에서 나온 할 일을 미리알림에 등록하기 위해 접근 권한이 필요합니다.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 내 공간의 오늘 일정 카드에 오늘 일정을 보여 주는 데 캘린더를 사용합니다. 일정은 이 아이폰 밖으로 보내지 않습니다.
        INFOPLIST_KEY_NSRemindersUsageDescription: 회의에서 나온 할 일을 미리알림에 등록하기 위해 접근 권한이 필요합니다.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 지역을 말하지 않고 날씨를 물었을 때 지금 있는 곳의 날씨를 보여 주는 데 사용합니다. 위치는 날씨를 받는 데만 쓰고 저장하지 않습니다.
        # 맥이 만든 영상·그림을 "사진에 저장"으로 넣을 때만 (D113, 사용자 승인 2026-11-17). 보관함을 읽지 않는다
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 맥이 만들어 보낸 영상과 그림을 사진 보관함에 저장하는 데 사용합니다. 사진 보관함의 내용은 읽지 않습니다.
        INFOPLIST_KEY_NSFaceIDUsageDescription: 이 아이폰에 저장해 둔 사이트 로그인 값을 꺼낼 때 본인인지 확인하는 데 사용합니다.
        # HTTPS(표준 암호화)만 사용하므로 수출 규정 면제 대상
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  # 알림 확장(D73): Apple을 거쳐 온 알림(정해진 문장과 번호)을 띄우기 전에, 그 번호로 맥에 직접 물어 실제 글로 바꾼다.
  # 주소·토큰은 앱과 같은 값(Config/Secrets.xcconfig)이라 앱 그룹·키체인 공유가 필요 없다. 권한(entitlements)도 없다.
  NotificationService:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: NotificationService
      # 앱과 함께 쓰는 파일 (테스트는 앱 쪽에서 한다)
      - path: MeetingSummary/Models/PushText.swift
      - path: MeetingSummary/Models/PushTextDelivery.swift
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: 모아
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MSAgentHost: $(AGENT_HOST)
        MSAgentToken: $(AGENT_APP_TOKEN)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.meetingsummary.NotificationService
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  # 홈 화면 위젯(D109): 내 공간의 카드를 맥에 직접 물어 보인다 (`GET /v1/space/widget`).
  # 주소·토큰은 앱과 같은 값이라 앱 그룹·키체인 공유가 필요 없다. 권한(entitlements)도 없다
  MoaWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: MoaWidget
      # 앱과 함께 쓰는 파일 (테스트는 앱 쪽에서 한다)
      - path: MeetingSummary/Models/SpaceWidgetData.swift
    info:
      path: MoaWidget/Info.plist
      properties:
        CFBundleDisplayName: 모아
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MSAgentHost: $(AGENT_HOST)
        MSAgentToken: $(AGENT_APP_TOKEN)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.meetingsummary.Widget
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  MeetingSummaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MeetingSummaryTests
    dependencies:
      - target: MeetingSummary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.meetingsummary.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MeetingSummary:
    build:
      targets:
        MeetingSummary: all
        MeetingSummaryTests: [test]
    test:
      targets:
        - MeetingSummaryTests
